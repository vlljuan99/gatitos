name: Deploy to Hetzner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bigotes
  cancel-in-progress: false

env:
  APP_URL: https://bigotes.167-233-99-156.sslip.io
  SERVER: root@167.233.99.156

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Falla en segundos (y no después de las pruebas) si falta configuración.
      - name: Comprobar secretos
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [[ -z "$HETZNER_SSH_KEY" ]]; then
            echo "::error title=Falta HETZNER_SSH_KEY::Añade la clave privada SSH del VPS en Settings → Secrets and variables → Actions (la misma que usan tri-dnd y el resto de proyectos)."
            exit 1
          fi

      # La clave se escribe sin «\r»: si se pegó desde Windows puede traer
      # saltos de línea CRLF y OpenSSH no aceptaría el fichero.
      - name: Preparar SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" | tr -d '\r' > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keygen -y -f ~/.ssh/hetzner > /dev/null || {
            echo "::error title=HETZNER_SSH_KEY no válida::El secreto no es una clave privada SSH. Pega el fichero completo, incluidas las líneas BEGIN y END."
            exit 1
          }
          ssh-keyscan -H 167.233.99.156 >> ~/.ssh/known_hosts
          printf 'Host 167.233.99.156\n  IdentityFile ~/.ssh/hetzner\n  IdentitiesOnly yes\n' >> ~/.ssh/config

      # Primer despliegue: crea /opt/bigotes/app.env con la cuenta de
      # administración inicial (secretos BIGOTES_ADMIN_*). Si ya existe, no se toca.
      - name: Preparar el servidor la primera vez
        env:
          ADMIN_EMAIL: ${{ secrets.BIGOTES_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BIGOTES_ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.BIGOTES_ADMIN_NAME }}
        run: |
          ssh "$SERVER" 'test -d /opt/tilestudio/sites && docker network inspect tilestudio_default >/dev/null' || {
            echo "::error::No encuentro el Caddy compartido de tilestudio (/opt/tilestudio/sites o la red tilestudio_default)."
            exit 1
          }
          if ssh "$SERVER" 'test -f /opt/bigotes/app.env'; then
            echo "/opt/bigotes/app.env ya existe: no se modifica."
            exit 0
          fi
          if [[ -z "$ADMIN_EMAIL" || ${#ADMIN_PASSWORD} -lt 8 ]]; then
            echo "::error title=Falta la cuenta de administración::Es el primer despliegue: añade los secretos BIGOTES_ADMIN_EMAIL y BIGOTES_ADMIN_PASSWORD (8 caracteres o más)."
            exit 1
          fi
          for value in "$ADMIN_EMAIL" "$ADMIN_PASSWORD" "$ADMIN_NAME"; do
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::Los secretos BIGOTES_ADMIN_* no pueden llevar comillas simples ni saltos de línea."
              exit 1
            fi
          done
          # Comillas simples: Compose lee el valor tal cual, sin interpolar «$».
          {
            echo "PORT=4000"
            echo "TZ=Europe/Madrid"
            echo "PUBLIC_URL=$APP_URL"
            echo "ADMIN_EMAIL='$ADMIN_EMAIL'"
            echo "ADMIN_PASSWORD='$ADMIN_PASSWORD'"
            echo "ADMIN_NAME='${ADMIN_NAME:-Administración}'"
            echo "RETENTION_MONTHS=12"
          } | ssh "$SERVER" 'umask 077 && mkdir -p /opt/bigotes && cat > /opt/bigotes/app.env'
          echo "Creado /opt/bigotes/app.env"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Instalar dependencias reproducibles
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Pruebas y build
        run: |
          npm test
          npm run build

      - name: Pruebas E2E en móvil (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Auditoría de dependencias de producción
        run: |
          npm audit --omit=dev --audit-level=high --prefix server
          npm audit --omit=dev --audit-level=high --prefix client

      - name: Preparar metadatos de versión
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Empaquetar fuentes verificadas
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./client/node_modules' \
              --exclude='./server/node_modules' \
              --exclude='./client/dist' \
              --exclude='./server/data' \
              --exclude='./e2e' \
              --exclude='./test-results' \
              --exclude='./deploy' \
              -czf "${RUNNER_TEMP}/src.tar.gz" .

      - name: Subir artefacto y scripts de operación
        run: |
          ssh "$SERVER" 'mkdir -p /opt/bigotes'
          scp "${RUNNER_TEMP}/src.tar.gz" "$SERVER:/opt/bigotes/src.tar.gz"
          scp deploy/server-compose.yml "$SERVER:/opt/bigotes/docker-compose.yml"
          scp deploy/build-on-server.sh "$SERVER:/opt/bigotes/build-on-server.sh"
          scp deploy/rollback.sh "$SERVER:/opt/bigotes/rollback.sh"
          scp deploy/bigotes.caddy "$SERVER:/opt/tilestudio/sites/bigotes.caddy"

      - name: Backup, build inmutable y reinicio
        id: deploy
        run: |
          ssh "$SERVER" \
            "chmod +x /opt/bigotes/build-on-server.sh /opt/bigotes/rollback.sh && \
             BIGOTES_IMAGE_TAG='${GITHUB_SHA}' \
             BIGOTES_GIT_SHA='${GITHUB_SHA}' \
             BIGOTES_APP_VERSION='${APP_VERSION}' \
             BIGOTES_BUILD_TIME='${BUILD_TIME}' \
             /opt/bigotes/build-on-server.sh"

      - name: Recargar Caddy
        run: |
          ssh "$SERVER" 'docker exec tilestudio-caddy-1 caddy reload --config /etc/caddy/Caddyfile'

      # Comprueba la web, SQLite, la revisión desplegada y la vista previa al
      # compartir. Reintenta durante 60 s mientras arranca (y Caddy saca el certificado).
      - name: Smoke test versionado
        run: |
          for i in $(seq 1 6); do
            HOME_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$APP_URL/" || true)
            HEALTH_BODY=$(curl -fsS "$APP_URL/api/health" || true)
            OG=$(curl -fsS "$APP_URL/match" | grep -c 'og:image' || true)
            COMMIT=$(jq -r '.commit // empty' <<<"$HEALTH_BODY" 2>/dev/null || true)
            DB_OK=$(jq -r '.database.ok // false' <<<"$HEALTH_BODY" 2>/dev/null || true)
            if [[ "$HOME_STATUS" == "200" && "$COMMIT" == "$GITHUB_SHA" && "$DB_OK" == "true" && "$OG" -ge 1 ]]; then
              echo "Smoke test correcto (intento $i): $COMMIT"
              exit 0
            fi
            echo "Intento $i: /=$HOME_STATUS commit=$COMMIT db=$DB_OK og=$OG"
            sleep 10
          done
          echo "El smoke test no validó la nueva versión"
          exit 1

      - name: Rollback automático del código si falla el smoke test
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        run: ssh "$SERVER" '/opt/bigotes/rollback.sh'
