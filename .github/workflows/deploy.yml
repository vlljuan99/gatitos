name: Deploy to Hetzner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bigotes
  cancel-in-progress: false

env:
  APP_URL: https://bigotes.167-233-99-156.sslip.io
  SERVER: root@167.233.99.156

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Instalar dependencias reproducibles
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Pruebas y build
        run: |
          npm test
          npm run build

      - name: Pruebas E2E en móvil (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Auditoría de dependencias de producción
        run: |
          npm audit --omit=dev --audit-level=high --prefix server
          npm audit --omit=dev --audit-level=high --prefix client

      - name: Preparar metadatos de versión
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Empaquetar fuentes verificadas
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./client/node_modules' \
              --exclude='./server/node_modules' \
              --exclude='./client/dist' \
              --exclude='./server/data' \
              --exclude='./e2e' \
              --exclude='./test-results' \
              --exclude='./deploy' \
              -czf "${RUNNER_TEMP}/src.tar.gz" .

      - name: Preparar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Verificar host
        run: ssh-keyscan -H 167.233.99.156 >> ~/.ssh/known_hosts

      - name: Subir artefacto y scripts de operación
        run: |
          ssh "$SERVER" 'mkdir -p /opt/bigotes'
          scp "${RUNNER_TEMP}/src.tar.gz" "$SERVER:/opt/bigotes/src.tar.gz"
          scp deploy/server-compose.yml "$SERVER:/opt/bigotes/docker-compose.yml"
          scp deploy/build-on-server.sh "$SERVER:/opt/bigotes/build-on-server.sh"
          scp deploy/rollback.sh "$SERVER:/opt/bigotes/rollback.sh"
          scp deploy/bigotes.caddy "$SERVER:/opt/tilestudio/sites/bigotes.caddy"

      - name: Backup, build inmutable y reinicio
        id: deploy
        run: |
          ssh "$SERVER" \
            "chmod +x /opt/bigotes/build-on-server.sh /opt/bigotes/rollback.sh && \
             BIGOTES_IMAGE_TAG='${GITHUB_SHA}' \
             BIGOTES_GIT_SHA='${GITHUB_SHA}' \
             BIGOTES_APP_VERSION='${APP_VERSION}' \
             BIGOTES_BUILD_TIME='${BUILD_TIME}' \
             /opt/bigotes/build-on-server.sh"

      - name: Recargar Caddy
        run: |
          ssh "$SERVER" 'docker exec tilestudio-caddy-1 caddy reload --config /etc/caddy/Caddyfile'

      # Comprueba la web, SQLite, la revisión desplegada y la vista previa al
      # compartir. Reintenta durante 60 s mientras arranca (y Caddy saca el certificado).
      - name: Smoke test versionado
        run: |
          for i in $(seq 1 6); do
            HOME_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$APP_URL/" || true)
            HEALTH_BODY=$(curl -fsS "$APP_URL/api/health" || true)
            OG=$(curl -fsS "$APP_URL/match" | grep -c 'og:image' || true)
            COMMIT=$(jq -r '.commit // empty' <<<"$HEALTH_BODY" 2>/dev/null || true)
            DB_OK=$(jq -r '.database.ok // false' <<<"$HEALTH_BODY" 2>/dev/null || true)
            if [[ "$HOME_STATUS" == "200" && "$COMMIT" == "$GITHUB_SHA" && "$DB_OK" == "true" && "$OG" -ge 1 ]]; then
              echo "Smoke test correcto (intento $i): $COMMIT"
              exit 0
            fi
            echo "Intento $i: /=$HOME_STATUS commit=$COMMIT db=$DB_OK og=$OG"
            sleep 10
          done
          echo "El smoke test no validó la nueva versión"
          exit 1

      - name: Rollback automático del código si falla el smoke test
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        run: ssh "$SERVER" '/opt/bigotes/rollback.sh'
